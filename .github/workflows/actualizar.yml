# Actualiza los datos, recalcula los modelos y publica la web en GitHub Pages.
#
# - Cada mañana (y a mano desde la pestaña Actions): descarga, modelos y publicación.
# - Al subir cambios a main (p. ej. desde GitHub Desktop): solo se reconstruye y publica
#   la web, con los datos que ya hay en el repositorio. Es rápido.
name: Actualizar y publicar

on:
  schedule:
    - cron: "37 4 * * *"        # 04:37 UTC: 5:37 en Madrid en invierno, 6:37 en verano
  workflow_dispatch:
    inputs:
      reentrenar_xg:
        description: "Reentrenar el modelo xG"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # para guardar las salidas en el repo
  pages: write      # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # datos crudos, caché de soccerdata y modelo xG: así solo se descarga lo nuevo
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            ~/soccerdata
            models
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Instalar
        run: pip install -e .

      - name: Pipeline
        run: |
          # el día 1 de cada mes (o si se pide a mano) se reentrena el modelo xG
          EXTRA=""
          if [ "$(date -u +%d)" = "01" ] || [ "${{ inputs.reentrenar_xg }}" = "true" ]; then
            EXTRA="--reentrenar-xg"
          fi
          rma ingesta
          rma procesar
          rma salidas $EXTRA

      - name: Guardar salidas en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data web/src/equipos web/src/en assets/escudos
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi

  web:
    needs: datos
    # se publica tanto si ha corrido la actualización como si no (push)
    if: always() && (needs.datos.result == 'success' || needs.datos.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # incluye el commit de datos recién hecho

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir la web
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deploy
        uses: actions/deploy-pages@v4